version: 2

project_name: leyline

builds:
  # linux only — the cli daemon (internal/cli/daemon) uses unix-only syscalls
  # (flock, unix sockets), so darwin/windows builds need source work first.
  # buildinfo.Value tracks the git tag via {{ .Version }} (e.g. 0.2.0), so the
  # binary's reported version always matches the release. Keep the four ldflags
  # lines below in sync. Versioning/parity policy: see the repo CLAUDE.md.
  - id: leyline
    main: ./cmd/leyline
    binary: leyline
    env: [CGO_ENABLED=0]
    goos: [linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X github.com/pawlenartowicz/leyline/internal/buildinfo.Value={{ .Version }}
  - id: leyline-server
    main: ./cmd/server
    binary: leyline-server
    env: [CGO_ENABLED=0]
    goos: [linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X github.com/pawlenartowicz/leyline/internal/buildinfo.Value={{ .Version }}
  - id: leyline-admin
    main: ./cmd/leyline-admin
    binary: leyline-admin
    env: [CGO_ENABLED=0]
    goos: [linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X github.com/pawlenartowicz/leyline/internal/buildinfo.Value={{ .Version }}
  - id: leyline-web
    main: ./cmd/leyline-web
    binary: leyline-web
    env: [CGO_ENABLED=0]
    goos: [linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X github.com/pawlenartowicz/leyline/internal/buildinfo.Value={{ .Version }}

archives:
  # One archive per release component. Names omit the version on purpose: the
  # version lives in the release tag (URL path), not the filename, so the
  # GitHub `releases/latest/download/<name>` URL is permanently stable and the
  # install docs never need bumping. `leyline-admin update` and the curl URLs
  # match by this exact versionless name. (project_name is `leyline` for all
  # builds, so the prefix can't come from .ProjectName.) The server archive
  # carries both server-box binaries.
  - id: leyline
    ids: [leyline]
    name_template: 'leyline_{{ .Os }}_{{ .Arch }}'
    formats: [tar.gz]
  - id: leyline-server
    ids: [leyline-server, leyline-admin]
    name_template: 'leyline-server_{{ .Os }}_{{ .Arch }}'
    formats: [tar.gz]
  - id: leyline-web
    ids: [leyline-web]
    name_template: 'leyline-web_{{ .Os }}_{{ .Arch }}'
    formats: [tar.gz]

checksum:
  name_template: checksums.txt

release:
  prerelease: false

nfpms:
  - id: leyline-server
    package_name: leyline-server
    file_name_template: '{{ .PackageName }}_{{ .Arch }}'
    ids: [leyline-server, leyline-admin]
    vendor: pawlenartowicz
    homepage: https://github.com/pawlenartowicz/leyline
    maintainer: pawlenartowicz <noreply@leyline.ink>
    description: leyline-server — WebSocket sync + REST admin for Obsidian vaults
    license: AGPL-3.0-or-later
    formats: [deb, rpm, apk]
    bindir: /usr/bin
    # revert/restore/GC shell out to the git binary at runtime (internal/server/storage/git.go).
    dependencies:
      - git
    contents:
      - src: packaging/server/systemd/leyline-server.service
        dst: /usr/lib/systemd/system/leyline-server.service
      - src: deploy/example/sysctl/99-leyline.conf
        dst: /usr/lib/sysctl.d/99-leyline.conf
      - src: deploy/example/journald/00-disk-cap.conf
        dst: /usr/lib/systemd/journald.conf.d/00-leyline-disk-cap.conf
      - src: packaging/server/openrc/leyline-server.initd
        dst: /etc/init.d/leyline-server
        file_info: { mode: 0755 }
        packager: apk
      - src: packaging/server/config.yaml
        dst: /etc/leyline/config.yaml
        type: config|noreplace
        file_info: { mode: 0644 }
    scripts:
      preinstall: packaging/server/scripts/preinstall.sh
      postinstall: packaging/server/scripts/postinstall.sh
      postremove: packaging/server/scripts/postremove.sh
    apk:
      scripts:
        postupgrade: packaging/server/scripts/postupgrade.sh
  - id: leyline-web
    package_name: leyline-web
    # Versionless filename (no .Version) so `releases/latest/download/<name>`
    # stays stable and `leyline-admin update`'s asset lookup matches; this also
    # overrides default nfpm naming, which yields x86_64 + an extra _linux_ segment.
    file_name_template: '{{ .PackageName }}_{{ .Arch }}'
    ids: [leyline-web]
    vendor: pawlenartowicz
    homepage: https://github.com/pawlenartowicz/leyline
    maintainer: pawlenartowicz <noreply@leyline.ink>
    description: leyline-web — read-only web view for Obsidian vaults
    license: AGPL-3.0-or-later
    formats: [deb, rpm, apk]
    bindir: /usr/bin
    contents:
      - src: packaging/web/systemd/leyline-web@.service
        dst: /usr/lib/systemd/system/leyline-web@.service
      - src: packaging/web/openrc/leyline-web.initd
        dst: /etc/init.d/leyline-web
        file_info: { mode: 0755 }
        packager: apk
    scripts:
      preinstall: packaging/web/scripts/preinstall.sh
      postinstall: packaging/web/scripts/postinstall.sh
